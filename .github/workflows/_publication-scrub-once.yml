name: One-shot publication scrub

on:
  push:
    branches:
      - publication/deep-scrub-2026-09-02

permissions:
  contents: write

jobs:
  scrub:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: publication/deep-scrub-2026-09-02
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply deterministic publication transform
        run: python scripts/_publication_scrub_once.py
      - name: Commit transformed files
        run: |
          if git diff --quiet; then
            echo 'No scrub changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'publication: genericize maintainer-bound public text'
          git push origin HEAD:publication/deep-scrub-2026-09-02
