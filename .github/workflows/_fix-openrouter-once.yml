name: One-shot OpenRouter fix

on:
  push:
    branches:
      - publication/deep-scrub-2026-09-02

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: publication/deep-scrub-2026-09-02
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/_fix_openrouter_once.py
      - name: Commit fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add arti_openrouter.py
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'fix: make OpenRouter non-fast fallback defined'
            git push origin HEAD:publication/deep-scrub-2026-09-02
          fi
