version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      python-dev-test:
        patterns:
          - "pytest"
          - "pytest-timeout"
          - "hypothesis"
        update-types:
          - "minor"
          - "patch"
      python-gpu-audio-runtime:
        patterns:
          - "numpy"
          - "faster-whisper"
          - "onnxruntime*"
          - "nvidia-*"
          - "sound*"
          - "praat-parselmouth"
          - "rapidocr*"
          - "supertonic"
        update-types:
          - "minor"
          - "patch"
      python-lightweight-runtime:
        patterns:
          - "*"
        exclude-patterns:
          - "pytest"
          - "pytest-timeout"
          - "hypothesis"
          - "numpy"
          - "faster-whisper"
          - "onnxruntime*"
          - "nvidia-*"
          - "sound*"
          - "praat-parselmouth"
          - "rapidocr*"
          - "supertonic"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: "npm"
    directory: "/mc-bot"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    groups:
      npm-non-major:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
